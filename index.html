<!DOCTYPE html>
<html lang="az">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>İmtahan Nəticələri - Güvən Nəşrləri</title>
    <link rel="icon" type="image/svg+xml" href="https://guvennesrleri.az/favicon.ico">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }
        body {
            background-color: #ffffff;
            color: #111827;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            overflow-x: hidden;
        }
        /* Background geometric lines pattern matching original */
        body::before {
            content: "";
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background-image: 
                linear-gradient(30deg, rgba(229, 231, 235, 0.4) 1px, transparent 1px),
                linear-gradient(150deg, rgba(229, 231, 235, 0.4) 1px, transparent 1px);
            background-size: 60px 60px;
            z-index: -1;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            width: 100%;
        }
        .close-btn {
            font-size: 28px;
            font-weight: 300;
            color: #111827;
            background: none;
            border: none;
            cursor: pointer;
        }
        .menu-btn {
            background: #f3f4f6;
            border: none;
            border-radius: 12px;
            width: 44px;
            height: 44px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 5px;
            cursor: pointer;
        }
        .menu-btn span {
            display: block;
            width: 18px;
            height: 2px;
            background-color: #111827;
            border-radius: 2px;
        }
        .container {
            max-width: 480px;
            width: 100%;
            margin: 0 auto;
            padding: 10px 20px 40px 20px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .back-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }
        .back-arrow-btn {
            background: #f3f4f6;
            border: none;
            border-radius: 12px;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            color: #111827;
        }
        h1 {
            font-size: 24px;
            font-weight: 700;
            color: #111827;
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: #374151;
            margin-bottom: 8px;
        }
        .select-box, .input-box {
            width: 100%;
            padding: 16px;
            background: #f9fafb;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            font-size: 16px;
            color: #111827;
            outline: none;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%236b7280' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 20px;
        }
        .input-box {
            background-image: none;
        }
        .select-box:focus, .input-box:focus {
            border-color: #3b82f6;
            background-color: #fff;
        }
        .btn-row {
            display: flex;
            gap: 12px;
            margin-top: 10px;
        }
        .submit-btn {
            flex: 1.2;
            background: #34d399;
            color: #065f46;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .submit-btn:hover {
            background: #10b981;
            color: #fff;
        }
        .cancel-btn {
            flex: 1;
            background: #f3f4f6;
            color: #374151;
            border: none;
            border-radius: 16px;
            padding: 16px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
        }
        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 6px;
            display: none;
        }

        /* Results Screen
